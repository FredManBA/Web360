# Publica (o retira) una propiedad del sitio de CodeLoba.
#
# Lo dispara el panel, nunca una persona a mano en circunstancias normales: la
# aplicación anota la operación en `publication_requests` y pide este workflow
# pasando SOLO su número. De ahí sale todo lo demás —qué propiedad, qué
# acción— leyéndolo de la base, que es lo que impide que tocar el input
# publique otra cosa.
#
# Lo que este workflow NO hace, y es tan importante como lo que hace:
#
#   - no aplica migraciones de D1. El esquema lo cambia una persona, a
#     conciencia, no un despliegue;
#   - no escribe estados editoriales. La única forma de que una propiedad pase
#     a `published` es que la aplicación lo aplique al confirmarse el
#     despliegue;
#   - no vuelve a construir nada después del deploy. Lo que se valida y lo que
#     se sube son el mismo artefacto.
#
# Antes de activarlo hay que configurar los secretos que se listan abajo; están
# documentados en `docs/publicacion.md`.

name: Publicar sitio

# El número de operación en el nombre del run: es lo que permite encontrarlo
# desde el panel, que guarda esa misma referencia.
run-name: 'Publicación · operación ${{ inputs.publicationRequestId }}'

on:
  workflow_dispatch:
    inputs:
      publicationRequestId:
        description: 'Número de la operación de publicación anotada en el panel'
        required: true
        type: string

# Exclusión global de despliegue.
#
# No basta con el índice de la base, que solo impide dos operaciones vivas
# sobre la MISMA propiedad: dos propiedades distintas pueden pedir publicarse a
# la vez y sus artefactos son incompatibles —cada uno contiene un catálogo
# entero—. El último en desplegar ganaría, y el otro quedaría confirmado sin
# estar en línea. Con un grupo único, el segundo espera.
#
# `cancel-in-progress: false` a propósito: cancelar una ejecución que quizá ya
# desplegó dejaría el estado real en el aire, que es justo lo que este flujo
# existe para evitar.
concurrency:
  group: codeloba-publicacion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # El mayor que declara `engines` en package.json.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        # `ci` y no `install`: instala exactamente el lock, sin resolver nada.
        run: npm ci

      - name: Escribir el identificador de la D1 en la configuración
        # ANTES de construir, y no después.
        #
        # `@astrojs/cloudflare` resuelve la configuración de Wrangler durante
        # el build y la congela en `dist/server/wrangler.json`; `wrangler
        # deploy` sigue el puntero de `.wrangler/deploy/config.json` y lee ESE
        # fichero, no `wrangler.jsonc`. Si el placeholder seguía puesto al
        # construir, ahí se queda: el despliegue muere con «binding DB of type
        # d1 must have a valid `database_id` specified» y haberlo escrito
        # después no arregla nada.
        #
        # Solo se toca la copia del runner, que se tira al acabar. El
        # repositorio conserva el placeholder.
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: npm run publication:wrangler-config

      - name: Construir la versión candidata
        env:
          # Se lee la D1 de producción, que es de donde tiene que salir el
          # catálogo real. El build muere si no puede leerla.
          CODELOBA_D1_SOURCE: remote
          CODELOBA_PUBLICATION_REQUEST: ${{ inputs.publicationRequestId }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_D1_READ_TOKEN }}
          PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
        run: npm run build

      - name: Comprobar que el artefacto es el de esta operación
        env:
          CODELOBA_PUBLICATION_REQUEST: ${{ inputs.publicationRequestId }}
        run: npm run publication:verify

      - name: Desplegar a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Sube lo que ya está construido y validado. No reconstruye.
        run: npx wrangler deploy

      - name: Marcar que el despliegue ocurrió
        # A partir de aquí un fallo NO puede reportarse como fallo de la
        # operación: el sitio ya está en línea y decirlo al revés dejaría la
        # base contradiciendo a la web. Si la confirmación falla, la operación
        # se queda viva y el panel la cierra con "Comprobar si ya se publicó".
        run: echo "CODELOBA_DEPLOYED=true" >> "$GITHUB_ENV"

      - name: Confirmar el resultado a la aplicación
        env:
          SITE_URL: ${{ vars.CODELOBA_SITE_URL }}
          MACHINE_SECRET: ${{ secrets.PUBLICATION_MACHINE_SECRET }}
          REQUEST_ID: ${{ inputs.publicationRequestId }}
        # La aplicación solo lo dará por bueno si el artefacto que responde
        # lleva dentro el manifiesto de esta misma operación.
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$SITE_URL/api/publication/machine" \
            --header "content-type: application/json" \
            --header "x-publication-machine-secret: $MACHINE_SECRET" \
            --data "{\"requestId\": $REQUEST_ID, \"ok\": true}"

      - name: Avisar de que no se llegó a desplegar
        # Solo cuando el fallo ocurrió ANTES del despliegue. Si ya se había
        # desplegado, no se afirma que fallara: no se sabe.
        if: failure() && env.CODELOBA_DEPLOYED != 'true'
        env:
          SITE_URL: ${{ vars.CODELOBA_SITE_URL }}
          MACHINE_SECRET: ${{ secrets.PUBLICATION_MACHINE_SECRET }}
          REQUEST_ID: ${{ inputs.publicationRequestId }}
        run: |
          curl --silent --show-error \
            --request POST "$SITE_URL/api/publication/machine" \
            --header "content-type: application/json" \
            --header "x-publication-machine-secret: $MACHINE_SECRET" \
            --data "{\"requestId\": $REQUEST_ID, \"ok\": false, \"error\": \"El build o el despliegue no terminaron.\"}"
